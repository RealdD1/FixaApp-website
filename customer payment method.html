<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Methods</title>
    <style>
        body{
             background-color: rgb(0, 21, 43);
      font-family: Arial, sans-serif;
      color: #0a2b36;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      min-height: 400px;
        }
        .container{
            display: flex;
            flex-direction: column;
            color: gold;
            align-content: center;
            text-align: center;
        }
        .input-group{
             width: 100%;
            padding: 1rem; /* Consistent padding with other inputs */
            margin: 0.5rem 0; /* Consistent margin with other inputs */
            border: none;
            border-radius: 2rem;
            background: #ffe4b5;
            color: #333;
            font-size: 1rem;
        }
        .payment-submit-btn{
             width: 100%;
      padding: 1rem;
      margin-top: 1rem;
      background-color: #fbd106;
     margin-left: 1rem;
      border: none;
      border-radius: 2rem;
      font-weight: bold;
      color: #004466;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
        }
        .payment-submit-btn:hover{
            opacity: 0.7;
        }
        .payment-submit-btn:active{
            opacity: 0.4;
        }
         .or-divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 20px 0;
        color: #aaa;
    }

    .or-divider::before,
    .or-divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #555;
    }

    .or-divider:not(:empty)::before {
        margin-right: .25em;
    }

    .or-divider:not(:empty)::after {
        margin-left: .25em;
    }

    </style>
</head>
<body>
    <div class="container">
        <h1>Payment Methods</h1>
        <label for="card-number">Card number</label>
        <input type="number" placeholder=" Enter card number " class="input-group"  required>
        <span style="color: red;margin-top: 0.5rem;"></span>
        <label for="card-pin">Card Pin</label>
        <input type="password"  class="input-group" placeholder="Enter card pin"required>
       <div>
 <label for="sss number">Security Number</label>
        <input type="number" placeholder="(e.g 000)"  class="input-group" required>
        <label for="expiry date">Expiry date</label>
        <input type="month">
       </div>
       
        <button class="payment-submit-btn">Submit</button>
         <div class="or-divider">OR</div>
         <div style="text-align: center; margin-top: 1rem;border-top:0;border-left:0; border-right:0;border-style:solid;">
             <a href="bank transfer.html" style="text-decoration: none;color: #fbd106;">Bank Transfer</a>
         </div>
        

    </div>
    
</body>
</html>
