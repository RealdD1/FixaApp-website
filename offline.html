<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fixa — Offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#00172b;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:2rem}
  .logo{color:#ffd700;font-size:2rem;font-weight:800;margin-bottom:12px}
  p{color:#9aa6b2;max-width:320px;line-height:1.5}
  button{margin-top:20px;background:#ffd700;border:none;color:#001;padding:12px 24px;border-radius:999px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <div class="logo">Fixa</div>
  <p>You're offline. Check your connection — once you're back online this page will reconnect automatically.</p>
  <button onclick="location.reload()">Try Again</button>
</body>
</html>
