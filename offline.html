<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#00172b"
  >

  <title>Fixa - You're Offline</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #00172b;
      color: #ffffff;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 86px;
      height: 86px;
      object-fit: contain;
      margin-bottom: 24px;
    }

    .icon {
      width: 86px;
      height: 86px;
      margin: 0 auto 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid #ffd700;
      border-radius: 50%;

      color: #ffd700;
      font-size: 38px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    p {
      color: #c8d2dc;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    button {
      border: none;
      background: #ffd700;
      color: #00172b;

      padding: 13px 24px;
      border-radius: 999px;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.3);
    }

    button:active {
      transform: scale(0.97);
    }

    .status {
      margin-top: 18px;
      font-size: 13px;
      color: #8fa3b5;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icon">
      ↯
    </div>

    <h1>You're offline</h1>

    <p>
      Fixa needs an internet connection to connect you
      with trusted artisans and keep your bookings up to date.
    </p>

    <button
      type="button"
      onclick="tryAgain()"
    >
      Try Again
    </button>

    <div
      id="status"
      class="status"
      aria-live="polite"
    ></div>

  </main>
<script>
  const statusEl = document.getElementById('status');
  let reloading = false;

function reloadPage() {
  if (reloading) return;

  reloading = true;
  statusEl.textContent = 'Connection restored. Reloading your page...';

  // Reload the exact URL currently in the browser.
  window.location.reload();
}

  async function tryAgain() {
    statusEl.textContent = 'Checking connection...';
    try {
      // Real network probe of the current URL. navigator.onLine is unreliable
      // (it can say true on wifi with no internet).
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 5000);
      const res = await fetch(location.href, { cache: 'no-store', signal: ctrl.signal });
      clearTimeout(t);

      if (res.ok) {
        reloadPage();
        return;
      }
      statusEl.textContent = 'Server unreachable. Please try again shortly.';
    } catch (err) {
      statusEl.textContent = 'Still offline. Please check your connection.';
    }
  }

  window.addEventListener('online', () => setTimeout(tryAgain, 500));
</script>

</body>
</html>
