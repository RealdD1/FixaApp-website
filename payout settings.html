<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="config.js"></script>
<title>Payout Settings - Fixa</title>
<style>
  body {
    background-color: rgb(0,23,43);
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  h1 {
    color: gold;
    text-align: center;
  }
  label {
    display: block;
    margin: 15px 0 5px;
  }
  input, select {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    margin-bottom: 10px;
    box-sizing: border-box;
  }
  button {
    background-color: gold;
    border: none;
    padding: 12px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div id="payoutCardView" style="display:none">
  <div style="background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.25);border-radius:16px;padding:20px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div style="font-size:12px;color:#9aa6b2;text-transform:uppercase">Payout Method</div>
        <div id="cardBankName" style="font-size:18px;font-weight:700;margin-top:4px"></div>
        <div id="cardAccountLine" style="font-size:13px;color:#cbd5e1;margin-top:2px"></div>
        <div id="cardFrequency" style="font-size:12px;color:#9aa6b2;margin-top:6px"></div>
      </div>
      <button type="button" id="changePayoutBtn" style="width:auto;margin-top:0;background:gold;color:#000;border:none;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer">Change</button>
    </div>
  </div>
</div>

<div id="payoutFormView">
  <h1>Payout Settings</h1>
  <p>Set up how you receive your artisan earnings.</p>

  <label for="bank">Bank Name</label>
  <select id="bank">
    <option value="">-- Select Your Bank --</option>
  </select>

  <label for="accountNumber">Account Number</label>
  <input type="text" id="accountNumber" placeholder="Enter your account number">

  <label for="accountName">Account Holder Name</label>
  <input type="text" id="accountName" placeholder="Auto-filled after verification" readonly>

  <label for="frequency">Payment Frequency</label>
  <select id="frequency">
    <option value="daily">Daily</option>
    <option value="weekly">Weekly</option>
    <option value="monthly">Monthly</option>
  </select>

  <button type="button" id="saveSettingsBtn">Save Settings</button>
</div>

<div id="statusMsg" style="display:none;margin-top:10px;padding:10px;border-radius:6px;font-size:13px"></div>

<script>
const BASE_URL = window.FIXA_CONFIG.API_URL;
const token = localStorage.getItem('token');
if (!token) window.location.replace('SignIn.html');

const $ = id => document.getElementById(id);
const bankSelect = $('bank'), accNumInput = $('accountNumber'), accNameInput = $('accountName');
const freqSelect = $('frequency'), saveBtn = $('saveSettingsBtn');
const auth = { Authorization: `Bearer ${token}` };
const authJson = { ...auth, 'Content-Type': 'application/json' };

let resolvedName = '', resolveSeq = 0, saving = false, hideTimer = null, hasSaved = false;

function showStatus(msg, isError) {
  const el = $('statusMsg');
  el.style.display = 'block';
  el.style.background = isError ? '#dc2626' : '#16a34a';
  el.style.color = '#fff';
  el.textContent = msg;
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { el.style.display = 'none'; }, 4500);
}

async function api(path, opts = {}) {
  const res = await fetch(`${BASE_URL}/api/payouts${path}`, { ...opts, headers: opts.body ? authJson : auth });
  if (res.status === 401) { localStorage.clear(); location.replace('SignIn.html'); throw new Error('Session expired'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || 'Request failed');
  return data;
}

function showView(card) {
  $('payoutCardView').style.display = card ? 'block' : 'none';
  $('payoutFormView').style.display = card ? 'none' : 'block';
  $('cancelChangeBtn').style.display = hasSaved && !card ? 'block' : 'none';
}

async function loadBanks() {
  try {
    const data = await api('/banks');
    const list = (Array.isArray(data) ? data : (data.banks || data.data || []))
      .slice().sort((a, b) => a.name.localeCompare(b.name));
    bankSelect.innerHTML = '<option value="">-- Select Your Bank --</option>' +
      list.map(b => `<option value="${b.code}">${b.name}</option>`).join('');
  } catch (e) { showStatus('Could not load bank list', true); }
}

async function loadPayoutSettings() {
  try {
    const p = await api('/settings');
    if (p?.recipientCode) {
      hasSaved = true;
      const last4 = String(p.accountNumber || '').slice(-4);
      $('cardBankName').textContent = p.bankName || '';
      $('cardAccountLine').textContent = `${p.accountName || ''} •••• ${last4}`;
      const f = p.frequency || 'weekly';
      $('cardFrequency').textContent = `Paid out ${f.charAt(0).toUpperCase() + f.slice(1)}`;
      bankSelect.value = p.bankCode || '';
      accNumInput.value = p.accountNumber || '';
      accNameInput.value = resolvedName = p.accountName || '';
      freqSelect.value = f;
      showView(true);
    } else { hasSaved = false; showView(false); }
  } catch (e) { console.error('loadPayoutSettings:', e); showView(false); }
}

async function tryResolve() {
  const seq = ++resolveSeq;                       // invalidates any request still in flight
  const bankCode = bankSelect.value, accountNumber = accNumInput.value.trim();
  resolvedName = ''; accNameInput.value = '';
  if (!bankCode || accountNumber.length !== 10) { saveBtn.disabled = false; return; }

  accNameInput.value = 'Verifying…';
  saveBtn.disabled = true;
  try {
    const data = await api('/resolve-account', { method: 'POST', body: JSON.stringify({ accountNumber, bankCode }) });
    if (seq !== resolveSeq) return;
    resolvedName = data.accountName;
    accNameInput.value = resolvedName;
  } catch (err) {
    if (seq !== resolveSeq) return;
    accNameInput.value = '';
    showStatus(err.message || 'Could not verify account', true);
  } finally {
    if (seq === resolveSeq) saveBtn.disabled = false;
  }
}

bankSelect.addEventListener('change', tryResolve);
accNumInput.addEventListener('input', () => {
  accNumInput.value = accNumInput.value.replace(/\D/g, '').slice(0, 10);
  tryResolve();                                    // verifies as soon as 10 digits are typed
});

saveBtn.addEventListener('click', async () => {
  if (saving) return;
  const bankCode = bankSelect.value;
  const bankName = bankSelect.options[bankSelect.selectedIndex]?.text;
  const accountNumber = accNumInput.value.trim();
  if (!bankCode || accountNumber.length !== 10 || !resolvedName) {
    return showStatus('Select a bank and enter a valid account number to verify first', true);
  }
  saving = true;
  const original = saveBtn.innerHTML;
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spin"></span>Saving…';
  try {
    await api('/settings', {
      method: 'PUT',
      body: JSON.stringify({ bankCode, bankName, accountNumber, accountName: resolvedName, frequency: freqSelect.value })
    });
    showStatus('Payout settings saved ✓', false);
    await loadPayoutSettings();
  } catch (err) {
    showStatus(err.message || 'Failed to save', true);
  } finally {
    saving = false; saveBtn.disabled = false; saveBtn.innerHTML = original;
  }
});

$('changePayoutBtn').addEventListener('click', () => showView(false));
$('cancelChangeBtn').addEventListener('click', () => showView(true));

document.addEventListener('DOMContentLoaded', () => { loadBanks().then(loadPayoutSettings); });
</script>

</body>
</html>
