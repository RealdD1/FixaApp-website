<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Fixa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #00172B;
            margin: 0;
            padding: 0;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background: #002540;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
            color: #FFD700;
            text-align: center;
        }

        .booking-section {
            margin-bottom: 25px;
        }
        
        .booking-section h3 {
            color: #ccc;
            border-bottom: 2px solid #FFD700;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .booking-card {
            background: #00172B;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 5px solid;
        }

        .booking-card.pending {
            border-color: #FFC107; /* Gold */
        }
        
        .booking-card.accepted {
            border-color: #28a745; /* Green */
        }

        .booking-card.rejected {
            border-color: #dc3545; /* Red */
        }

        .booking-card p {
            margin: 5px 0;
            font-size: 0.9em;
        }

        .booking-card p strong {
            color: #FFD700;
            margin-right: 5px;
        }

        .empty-state {
            text-align: center;
            color: #a0a0a0;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>My Bookings</h2>
        <div class="booking-section">
            <h3 id="accepted-header">Total Booking</h3>
            <div id="accepted-list">
                </div>
        </div>
        <div class="booking-section">
            <h3 id="pending-header">Pending</h3>
            <div id="pending-list">
                </div>
        </div>
        <div class="booking-section">
            <h3 id="accepted-header">Accepted</h3>
            <div id="accepted-list">
                </div>
        </div>
        <div class="booking-section">
            <h3 id="rejected-header">Rejected</h3>
            <div id="rejected-list">
                </div>
        </div>
        <div class="booking-section">
            <h3 id="completed-header">Completed</h3>
            <div id="completed-list">
                </div>
        </div>
    </div>
    <script src="customer-booking-history.js">
        
    </script>
</body>
</html>
