<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Fixa</title>
<script src="config.js"></script>
<style>
body{background:rgb(0,21,43);font-family:Arial;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.card{background:rgb(0,23,43);border:1px solid gray;border-radius:1rem;padding:2rem 1.5rem;width:100%;max-width:400px}
h2{color:#fbd106;text-align:center;margin-bottom:1rem}
input{width:100%;padding:1rem;margin:.5rem 0;border:none;border-radius:2rem;background:#ffe4b5;color:#333;font-size:1rem}
button{width:100%;padding:1rem;margin-top:1rem;background:#fbd106;border:none;border-radius:2rem;font-weight:bold;color:#004466;font-size:1.1rem;cursor:pointer}
button:disabled{background:#ccc;cursor:not-allowed}
.msg{margin-top:1rem;text-align:center;font-size:.9em}
</style></head><body>
<div class="card">
  <h2>Reset your password</h2>
  <p style="font-size:.9em;color:#ccc;margin-bottom:1rem">Enter your email or username and we'll send you a reset link.</p>
  <input type="text" id="contact" placeholder="Email or Username"/>
  <button id="sendBtn">Send Reset Link</button>
  <p id="msg" class="msg"></p>
</div>
<script>
document.getElementById('sendBtn').addEventListener('click', async () => {
  const contact = document.getElementById('contact').value.trim();
  const btn = document.getElementById('sendBtn');
  const msg = document.getElementById('msg');
  if (!contact) { msg.textContent = 'Enter your email or username'; return; }
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    const res = await fetch(`${FIXA_CONFIG.API_URL}/api/users/forgot-password`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contact })
    });
    const data = await res.json();
    msg.textContent = data.message || 'Check your email for the reset link.';
  } catch {
    msg.textContent = 'Network error. Try again.';
  } finally {
    btn.disabled = false; btn.textContent = 'Send Reset Link';
  }
});
</script>
</body></html>
