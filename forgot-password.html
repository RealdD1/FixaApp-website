<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — Fixa</title>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:rgb(0,21,43);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.card{background:rgb(0,30,58);border:1px solid #2c4560;border-radius:1rem;padding:2rem 1.5rem;width:100%;max-width:400px}
h1{color:#fbd106;font-size:1.5rem;margin:0 0 .5rem}
p.sub{color:#b8c7d6;font-size:.95rem;line-height:1.5;margin:0 0 1.5rem}
label{display:block;font-size:.85rem;color:#b8c7d6;margin-bottom:.4rem}
input{width:100%;padding:.9rem 1rem;border:2px solid transparent;border-radius:.75rem;background:#ffe4b5;color:#222;font-size:1rem}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn{width:100%;padding:.95rem;margin-top:1rem;background:#fbd106;border:none;border-radius:.75rem;font-weight:700;color:#00253f;font-size:1rem;cursor:pointer}
.btn:disabled{background:#6b7c8c;color:#cfd8e0;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid #fbd106;color:#fbd106}
.btn.ghost:disabled{border-color:#6b7c8c;color:#8d9cab}
.err{color:#ff9b9b;font-size:.9rem;margin:.75rem 0 0;min-height:1.2em}
.back{display:block;text-align:center;margin-top:1.25rem;color:#b8c7d6;font-size:.9rem}
.tick{width:48px;height:48px;border-radius:50%;background:#fbd106;color:#00253f;display:grid;place-items:center;font-size:1.6rem;font-weight:700;margin-bottom:1rem}
[hidden]{display:none!important}

     .logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 60px; /* hand + spanner icon size */
      height: auto;
      margin-right: 12px;
    }

    .logo-text {
      font-size: 2rem;
      font-weight: bold;
      color: gold;
      letter-spacing: 1px;
    }
</style></head><body>
   <div class="logo-wrapper">
      <img src="fixa-logo.png" alt="Hand holding spanner" class="logo-icon">
      <div class="logo-text">Fixa</div>
    </div>
<main class="card">
  <section id="formView">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter the email or username on your account and we'll send you a link to set a new one.</p>
    <form id="form" novalidate>
      <label for="contact">Email or username</label>
      <input id="contact" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <p id="err" class="err" role="alert"></p>
      <button id="btn" class="btn" type="submit">Send reset link</button>
    </form>
  </section>

  <section id="doneView" hidden>
    <div class="tick" aria-hidden="true">✓</div>
    <h1>Check your inbox</h1>
    <p class="sub">If an account matches <strong id="who"></strong>, a reset link is on its way. It expires in 30 minutes. Check your spam folder if you don't see it.</p>
    <button id="resend" class="btn ghost" type="button" disabled>Resend in 60s</button>
    <button id="other" class="btn ghost" type="button" style="margin-top:.5rem">Use a different account</button>
  </section>

  <a class="back" href="SignIn.html">Back to sign in</a>
</main>
<script>
const $ = id => document.getElementById(id);
let last = '', timer;

async function send(value) {
  const res = await fetch(`${FIXA_CONFIG.API_URL}/api/users/forgot-password`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contact: value })
  });
  if (res.status === 429) throw new Error('Too many attempts. Wait a few minutes and try again.');
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || 'Something went wrong. Try again.');
}

function cooldown(s) {
  const b = $('resend');
  clearTimeout(timer);
  b.disabled = true;
  (function tick() {
    if (s <= 0) { b.disabled = false; b.textContent = 'Send link again'; return; }
    b.textContent = `Resend in ${s--}s`;
    timer = setTimeout(tick, 1000);
  })();
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const value = $('contact').value.trim();
  const btn = $('btn');
  $('err').textContent = '';
  if (!value) { $('err').textContent = 'Enter your email or username.'; $('contact').focus(); return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    await send(value);
    last = value;
    $('who').textContent = value;
    $('formView').hidden = true;
    $('doneView').hidden = false;
    cooldown(60);
  } catch (ex) {
    $('err').textContent = ex instanceof TypeError ? 'Network error. Check your connection and try again.' : ex.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Send reset link';
  }
});

$('resend').addEventListener('click', async () => {
  const b = $('resend');
  b.disabled = true; b.textContent = 'Sending…';
  try { await send(last); } catch {}
  cooldown(60);
});

$('other').addEventListener('click', () => {
  clearTimeout(timer);
  $('doneView').hidden = true;
  $('formView').hidden = false;
  $('contact').value = '';
  $('contact').focus();
});
</script>
</body></html>
