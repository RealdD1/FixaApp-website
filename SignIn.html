 <meta name="theme-color" content="#00172b">

  <style>
     :root {
    --color-dark-navy-1: rgb(0, 23, 43); 
    --color-dark-navy-2: rgb(5, 35, 65); 
    --color-gold: #FFC300;             
    --color-white: #ffffff;
    --color-error: #ff4d4d; /* RED for Offline */
    --color-success: #4CAF50; /* GREEN for Online */
}
  * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* === 8. NETWORK STATUS BANNER === */
.network-status {
  background-color: #333;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 10px 20px;
    text-align: center;
    color: var(--color-white);
    font-weight: 600;
    font-size: 1rem;
    z-index: 2000;
    /* Initial state: Hidden off-screen, but we use transition for smooth movement */
    transform: translateY(-100%); 
    transition: transform 0.4s ease-in-out;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}

.network-status i {
    margin-right: 8px;
}

/* State when the user is OFFLINE */
.network-status.offline {
    background-color: var(--color-error); /* Bright red */
    /* Bring the banner down when the 'offline' class is present */
    transform: translateY(0); 
}

/* State when the user is ONLINE (optional, can be used for a temporary "Welcome Back" message) */
.network-status.online-success {
    background-color: var(--color-success); /* Green */
    /* Ensure the banner is visible for a short time */
    transform: translateY(0); 
}

    body {
      background-color: rgb(0, 21, 43);
      font-family: Arial, sans-serif;
      color: #0a2b36;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      min-height: 100vh;
    }

     .logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 60px; /* hand + spanner icon size */
      height: auto;
      margin-right: 12px;
    }

    .logo-text {
      font-size: 2rem;
      font-weight: bold;
      color: gold;
      letter-spacing: 1px;
    }

    .input-error-message {
        font-size: 1rem;
        margin-left: 10px;
        display: block;
        text-align: left;
        padding-left: 1rem;
        margin-top: 5px;
        color: red;

      border-color: gray;
      border-style: solid;
      border-width: 1px;
      border-radius: 1rem;
      width: 100%;

    .form-card h2 {

    form input::placeholder {

    form button {

    }

    form button:hover:not(:disabled) {

    }

    form button:disabled {

      color: #666;
      cursor: not-allowed;
    }

    .or-divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 20px 0;
        color: #aaa;
    }

    .or-divider::before,
    .or-divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #555;
    }

    .or-divider:not(:empty)::before {
        margin-right: .25em;
    }

    .or-divider:not(:empty)::after {
        margin-left: .25em;
    }

    .google-signin-btn {
        background-color: #4285F4; /* Google Blue */
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0.8rem 1rem;
        border-radius: 2rem;
        cursor: pointer;
        font-size: 1rem;
        margin-top: 1rem;
        transition: background-color 0.3s ease;
        border: none;
        width: 100%;
        font-weight: bold;
    }

    .google-signin-btn:hover {
        background-color: #357ae8;
    }

    .google-signin-btn img {
        width: 20px;
        height: 20px;
    }

    .signup-link, .forgot-password-link {
      margin-top: 1rem;
      text-align: center;
      color:white;
    }

    .signup-link a, .forgot-password-link a {
      color: gold;
      text-decoration: underline;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
      text-align: center;
      min-height: 20px;
      font-size: 0.9em;
      color: white;
    }
    .message.success { background-color: #388e3c; color: white; }
    .message.error { background-color: #d32f2f; color: white; }
    .message.info { background-color: #1976d2; color: white; }

    /* Spinner style */
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #fbd106; /* Gold color */
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-left: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Loader styles - ensure it covers the whole screen */
    .loader {
      display: none; /* Hidden by default */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 21, 43, 0.95); /* Slightly transparent dark background */
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999; /* Ensure it's on top of everything */
    }

    .loader .logo {
      color: #FFD700; /* Gold */
      font-size: 3rem;
      font-weight: bold;
      z-index: 2;
      animation: pulse 2s infinite;
      position: relative;
    }

    .spinner-ring {
      position: absolute;
      width: 120px;
      height: 120px;
      border: 4px solid transparent;
      border-top: 4px solid #FFD700;
      border-radius: 50%;
      animation: spin 2s linear infinite;
    }

    .spinner-ring.behind {
      z-index: 1;
      opacity: 0.5; /* Make the behind spinner slightly transparent */
      transform: scale(0.8); /* Slightly smaller */
    }

    .spinner-ring.front {
      z-index: 3;
      clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%); /* Only show top half */
    }
  </style>

<body>
  <div id="networkStatusBanner" class="network-status">
    <i class="fas fa-exclamation-triangle"></i> You are currently offline. Please check your connection.
</div>
 <div class="logo-wrapper">
      <img src="fixa-logo.png" alt="Hand holding spanner" class="logo-icon">
      <div class="logo-text">Fixa</div>
    </div>
  <div class="form-card">
    <h2>Sign In</h2>
    <form id="signinForm">
      <div class="input-group">
        <input type="text" id="emailOrUsernameInput" placeholder="Email or Username" required />
        <span id="emailOrUsernameError" class="input-error-message"></span>
      </div>

      <div class="input-group">
        <input type="password" id="passwordInput" placeholder="Password" required />

    </form>

    <p class="forgot-password-link">
        <a href="#" id="forgotPasswordLink">Forgot Password?</a>
    </p>

    <div class="or-divider">OR</div>

 <!-- Google's official One-Tap / Sign-In button -->
<div id="g_id_onload"
     data-client_id="646173329603-qv26654b3s8c8pg9k7k00to1t1g79b3k.apps.googleusercontent.com"
     data-callback="handleGoogleAuth"
     data-auto_select="false"
     data-context="signin">
</div>
<div class="g_id_signin"
     data-type="standard"
     data-shape="pill"
     data-theme="filled_blue"
     data-text="signin_with"
     data-size="large"
     data-logo_alignment="left"
     data-width="320">
</div>

    <p class="signup-link">
      Don't have an account? <a href="Signup.html" id="signUpLink">Sign Up</a>
    </p>
  </div>

  <div id="loader" class="loader">
    <div class="spinner-ring behind"></div>
    <div class="logo">Fixa</div>
    <div class="spinner-ring front"></div>
  </div>
<script>

const signinForm = document.getElementById('signinForm');
const contactInput = document.getElementById('emailOrUsernameInput');
const passwordInput = document.getElementById('passwordInput');
const signinBtn = document.getElementById('signinBtn');
const messageDisplay = document.getElementById('messageDisplay');

signinForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const contact = contactInput.value.trim();
    const password = passwordInput.value;

    if (!contact) {
        messageDisplay.textContent = 'Please enter email or username.';
        messageDisplay.className = 'message error';
        return;
    }
    if(!password){
      messageDisplay.textContent ='Please enter your password.';
      messageDisplay.className ='message error';
      return;
    }

     loader.style.display = 'flex';
    signinBtn.disabled = true;
    messageDisplay.textContent = 'Logging in...';
    messageDisplay.className = 'message info';

    try {
         const response = await fetch(`${FIXA_CONFIG.API_URL}/api/users/login`,
         { method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contact, password })
        });

        const data = await response.json();

        if (response.ok) {
            messageDisplay.textContent = 'Login successful! Redirecting...';
            messageDisplay.className = 'message success';

            // Save JWT token and user info
     // --- Login Success Block ---

// Always store the full user object and token for general use
localStorage.setItem('token', data.token);
localStorage.setItem('user', JSON.stringify(data.user));

// Check the user's role and store their ID in the appropriate key
if (data.user.role === "customer") {
    // Store customer ID if the user is a customer
    localStorage.setItem('customer_id', data.user.id);
} else if (data.user.role === "artisan") {
    // 💡 FIX: Store artisan ID if the user is an artisan
    localStorage.setItem('artisan_id', data._id); 
}

// --- Redirection Logic ---

if (!data.user.role || data.user.role.trim() === "") {
    window.location.href = "role-selection.html"; 
} else if (data.user.role === "customer") {
    window.location.href = "customer-home.html"; 
} else if (data.user.role === "artisan") {
    window.location.href = "artisan test.html"; 
}
        } else {
            messageDisplay.textContent = data.message || 'Login failed.';
            messageDisplay.className = 'message error';
        }
    } catch (error) {
        console.error(error);
        messageDisplay.textContent = 'Network error. Try again.';
        messageDisplay.className = 'message error';
    } finally {
         loader.style.display = 'none';
        signinBtn.disabled = false;
    }
});
// Google Sign-In callback — fired by Google when user picks an account
async function handleGoogleAuth(response) {
  const credential = response.credential;
  if (!credential) {
    messageDisplay.textContent = 'Google sign-in cancelled';
    messageDisplay.className = 'message error';
    return;
  }

  loader.style.display = 'flex';
  messageDisplay.textContent = 'Signing in with Google...';
  messageDisplay.className = 'message info';

  try {
      const res = await fetch(`${FIXA_CONFIG.API_URL}/api/users/google-auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential })
    });
    const data = await res.json();

    if (!res.ok) {
      messageDisplay.textContent = data.message || 'Google sign-in failed';
      messageDisplay.className = 'message error';
      return;
    }

    // Same storage as regular login
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    if (data.user.role === 'customer') localStorage.setItem('customer_id', data.user._id);
    if (data.user.role === 'artisan')  localStorage.setItem('artisan_id', data.user._id);

    messageDisplay.textContent = data.isNewUser
      ? 'Welcome to Fixa! Redirecting...'
      : 'Login successful! Redirecting...';
    messageDisplay.className = 'message success';

    // Redirect based on role
    if (data.needsRoleSelection || !data.user.role) {
      window.location.href = 'role-selection.html';
    } else if (data.user.role === 'customer') {
      window.location.href = 'customer-home.html';
    } else if (data.user.role === 'artisan') {
      window.location.href = 'artisan test.html';
    }
  } catch (err) {
    console.error('[Google sign-in]', err);
    messageDisplay.textContent = 'Network error. Try again.';
    messageDisplay.className = 'message error';
  } finally {
    loader.style.display = 'none';
  }
}

// Expose globally so Google's library can find it
window.handleGoogleAuth = handleGoogleAuth;
// --- Network Status Checker Functions ---//

function updateNetworkStatus() {
    if (navigator.onLine) {
        // User is online. Hide the error banner and show a temporary "back online" message.
        networkStatusBanner.classList.remove('offline');
        
        // Optional: Show "Back Online" message briefly
        networkStatusBanner.classList.add('online-success');
        networkStatusBanner.innerHTML = '<i class="fas fa-check-circle"></i> Connection restored. You are back online.';
        
        // Hide the success message after 3 seconds
        setTimeout(() => {
            networkStatusBanner.classList.remove('online-success');
        }, 3000);

    } else {
        // User is offline. Display the error banner immediately.
        networkStatusBanner.classList.remove('online-success');
        networkStatusBanner.classList.add('offline');
        networkStatusBanner.innerHTML = '<i class="fas fa-exclamation-triangle"></i> You are currently offline. Please check your connection.';
    }
}

// Attach event listeners to the window
window.addEventListener('online', updateNetworkStatus);
window.addEventListener('offline', updateNetworkStatus);

// Initial check when the page loads
document.addEventListener('DOMContentLoaded', () => {
    // ... existing DOMContentLoaded code (updateSignupButtonState, etc.) ...
    
    // Perform an initial check
    updateNetworkStatus(); 
});
</script>

<script src="/theme.js"></script>
