<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — Fixa</title>
<meta name="referrer" content="no-referrer">
<script src="config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:rgb(0,21,43);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.card{background:rgb(0,30,58);border:1px solid #2c4560;border-radius:1rem;padding:2rem 1.5rem;width:100%;max-width:400px}
h1{color:#fbd106;font-size:1.5rem;margin:0 0 .5rem}
p.sub{color:#b8c7d6;font-size:.95rem;line-height:1.5;margin:0 0 1.5rem}
label{display:block;font-size:.85rem;color:#b8c7d6;margin:1rem 0 .4rem}
.field{position:relative}
input{width:100%;padding:.9rem 4.5rem .9rem 1rem;border:2px solid transparent;border-radius:.75rem;background:#ffe4b5;color:#222;font-size:1rem}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.show{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#00253f;font-weight:600;font-size:.85rem;cursor:pointer;padding:.5rem}
.hint{font-size:.85rem;margin:.4rem 0 0;color:#b8c7d6;min-height:1.2em}
.hint.ok{color:#8fe0a8}.hint.bad{color:#ff9b9b}
.btn{display:block;width:100%;padding:.95rem;margin-top:1.5rem;background:#fbd106;border:none;border-radius:.75rem;font-weight:700;color:#00253f;font-size:1rem;cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{background:#6b7c8c;color:#cfd8e0;cursor:not-allowed}
.err{color:#ff9b9b;font-size:.9rem;margin:.75rem 0 0;min-height:1.2em}
.tick{width:48px;height:48px;border-radius:50%;background:#fbd106;color:#00253f;display:grid;place-items:center;font-size:1.6rem;font-weight:700;margin-bottom:1rem}
[hidden]{display:none!important}
</style></head><body>
<main class="card">
  <section id="formView">
    <h1>Set a new password</h1>
    <p class="sub">Choose a password with at least 8 characters.</p>
    <form id="form" novalidate>
      <label for="pw">New password</label>
      <div class="field">
        <input id="pw" type="password" autocomplete="new-password" required>
        <button type="button" class="show" data-for="pw" aria-label="Show password">Show</button>
      </div>
      <p id="pwHint" class="hint"></p>

      <label for="pw2">Confirm password</label>
      <div class="field">
        <input id="pw2" type="password" autocomplete="new-password" required>
        <button type="button" class="show" data-for="pw2" aria-label="Show confirmation">Show</button>
      </div>
      <p id="pw2Hint" class="hint"></p>

      <p id="err" class="err" role="alert"></p>
      <button id="btn" class="btn" type="submit">Save new password</button>
    </form>
  </section>

  <section id="doneView" hidden>
    <div class="tick" aria-hidden="true">✓</div>
    <h1>Password updated</h1>
    <p class="sub">You can now sign in with your new password. Taking you there…</p>
    <a class="btn" href="login.html">Go to sign in</a>
  </section>

  <section id="badView" hidden>
    <h1>This link isn't valid</h1>
    <p class="sub">It may have expired or already been used. Request a new one and try again.</p>
    <a class="btn" href="forgot-password.html">Request a new link</a>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const token = params.get('token');
const email = params.get('email');
history.replaceState(null, '', location.pathname); // keep the token out of the address bar and history

if (!token || !email) { $('formView').hidden = true; $('badView').hidden = false; }

document.querySelectorAll('.show').forEach(b => b.addEventListener('click', () => {
  const i = $(b.dataset.for), showing = i.type === 'text';
  i.type = showing ? 'password' : 'text';
  b.textContent = showing ? 'Show' : 'Hide';
}));

function check() {
  const a = $('pw').value, b = $('pw2').value;
  const h1 = $('pwHint'), h2 = $('pw2Hint');
  h1.className = 'hint'; h2.className = 'hint';
  h1.textContent = a ? (a.length >= 8 ? 'Long enough' : `${8 - a.length} more character${8 - a.length === 1 ? '' : 's'} needed`) : '';
  if (a) h1.classList.add(a.length >= 8 ? 'ok' : 'bad');
  h2.textContent = b ? (a === b ? 'Passwords match' : "Passwords don't match") : '';
  if (b) h2.classList.add(a === b ? 'ok' : 'bad');
  return a.length >= 8 && a === b;
}
$('pw').addEventListener('input', check);
$('pw2').addEventListener('input', check);

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('err').textContent = '';
  if (!check()) { $('err').textContent = 'Fix the highlighted fields first.'; return; }
  const btn = $('btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await fetch(`${FIXA_CONFIG.API_URL}/api/users/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, token, newPassword: $('pw').value })
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 429) throw new Error('Too many attempts. Wait a few minutes and try again.');
    if (!res.ok) {
      if (res.status === 400 && /invalid|expired/i.test(data.message || '')) {
        $('formView').hidden = true; $('badView').hidden = false; return;
      }
      throw new Error(data.message || 'Something went wrong. Try again.');
    }
    $('formView').hidden = true; $('doneView').hidden = false;
    setTimeout(() => location.href = 'login.html', 3000);
  } catch (ex) {
    $('err').textContent = ex instanceof TypeError ? 'Network error. Check your connection and try again.' : ex.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Save new password';
  }
});
</script>
</body></html>
