<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — Fixa</title>
<script src="config.js"></script>
<style>
body{background:rgb(0,21,43);font-family:Arial;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.card{background:rgb(0,23,43);border:1px solid gray;border-radius:1rem;padding:2rem 1.5rem;width:100%;max-width:400px}
h2{color:#fbd106;text-align:center;margin-bottom:1rem}
input{width:100%;padding:1rem;margin:.5rem 0;border:none;border-radius:2rem;background:#ffe4b5;color:#333;font-size:1rem}
button{width:100%;padding:1rem;margin-top:1rem;background:#fbd106;border:none;border-radius:2rem;font-weight:bold;color:#004466;font-size:1.1rem;cursor:pointer}
button:disabled{background:#ccc;cursor:not-allowed}
.msg{margin-top:1rem;text-align:center;font-size:.9em}
</style></head><body>
<div class="card">
  <h2>Set a new password</h2>
  <input type="password" id="newPassword" placeholder="New password (min 8 characters)"/>
  <input type="password" id="confirmPassword" placeholder="Confirm new password"/>
  <button id="submitBtn">Update Password</button>
  <p id="msg" class="msg"></p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const email = params.get('email');
if (!token || !email) {
  document.getElementById('msg').textContent = 'Invalid or missing reset link.';
  document.getElementById('submitBtn').disabled = true;
}
document.getElementById('submitBtn').addEventListener('click', async () => {
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  if (newPassword.length < 8) { msg.textContent = 'Password must be at least 8 characters'; return; }
  if (newPassword !== confirmPassword) { msg.textContent = 'Passwords do not match'; return; }
  btn.disabled = true; btn.textContent = 'Updating...';
  try {
    const res = await fetch(`${FIXA_CONFIG.API_URL}/api/users/reset-password`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, token, newPassword })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Failed');
    msg.textContent = 'Password updated! Redirecting to sign in...';
    setTimeout(() => window.location.href = 'SignIn.html', 1500);
  } catch (err) {
    msg.textContent = err.message;
    btn.disabled = false; btn.textContent = 'Update Password';
  }
});
</script>
</body></html>
