services:
  - type: web
    runtime: static
    name: fixa-frontend
    staticPublishPath: .
    routes:
      # old .html URLs -> clean URLs
      - type: redirect
        source: /signin.html
        destination: /signin
      - type: redirect
        source: /personal-info.html
        destination: /personal-info
      # ...one per page

      # clean URLs -> actual files
      - type: rewrite
        source: /signin
        destination: /signin.html
      - type: rewrite
        source: /personal-info
        destination: /personal-info.html
      # ...one per page