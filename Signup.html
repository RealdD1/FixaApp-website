<body>
  <div id="networkStatusBanner" class="network-status">
    <i class="fas fa-exclamation-triangle"></i> You are currently offline. Please check your connection.
</div>
     <div class="logo-wrapper">
      <img src="fixa-logo.png" alt="Hand holding spanner" class="logo-icon">
      <div class="logo-text">Fixa</div>
    </div>
    

  <div class="form-card">
    <h2>Sign Up</h2>
    <form id="signupForm">
      <div class="input-group">
      <input type="text" id="emailOrPhoneInput" placeholder="Email or phone (e.g. +234...)" required />
        <span id="emailOrPhoneError" class="input-error-message"></span>
      </div>

      <div class="input-group">
    
        <input type="text" id="username" name="username" placeholder="Username" required />
            <div class="username-status-container">
         <span id="usernameStatus" class="username-status"></span>
          <span id="usernameLoader" class="loader" style="display:none;"></span></div>
        
      </div>

      <div class="input-group">
        <input type="password" id="passwordInput" placeholder="Password" required />
        <span id="passwordError" class="input-error-message"></span>
      </div>

      <div class="input-group">
        <input type="password" id="reconfirmPasswordInput" placeholder="Reconfirm password" required />
        <span id="reconfirmPasswordError" class="input-error-message"></span>
      </div>

      <button type="submit" id="signupBtn">Sign Up</button>
      <p id="messageDisplay" class="message"></p>
    </form>

    <div class="or-divider">OR</div>
<div id="g_id_onload"
     data-client_id="646173329603-qv26654b3s8c8pg9k7k00to1t1g79b3k.apps.googleusercontent.com"
     data-callback="handleGoogleAuth"
     data-auto_select="false"
     data-context="signup">
</div>
<div class="g_id_signin"
     data-type="standard"
     data-shape="pill"
     data-theme="filled_blue"
     data-text="signup_with"
     data-size="large"
     data-logo_alignment="left"
     data-width="320">
</div>

    <p class="signin-link">
      Already have an account? <a href="SignIn.html" id="signInLink">Sign In</a>
    </p>

  </div>
  <script>
    const signupForm = document.getElementById("signupForm");
    const emailOrPhoneInput = document.getElementById("emailOrPhoneInput");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("passwordInput");
    const reconfirmPasswordInput = document.getElementById("reconfirmPasswordInput");
    const signupBtn = document.getElementById("signupBtn");
    const usernameStatus = document.getElementById("usernameStatus");
    const usernameLoader = document.getElementById("usernameLoader");
    const messageDisplay = document.getElementById("messageDisplay");

  let debounceTimeout;
usernameInput.addEventListener('input', () => {
  clearTimeout(debounceTimeout);
  const username = usernameInput.value.trim();

  // Rule: at least 3 chars
  if (username.length < 3) {
    usernameStatus.textContent = 'Username must be at least 3 characters';
    usernameStatus.className = 'username-status error';
    usernameLoader.style.display = 'none';
    return;
  }

  // Rule: no spaces
  if (/\s/.test(username)) {
    usernameStatus.textContent = 'Username cannot contain spaces';
    usernameStatus.className = 'username-status error';
    usernameLoader.style.display = 'none';
    return;
  }

  // Rule: cannot start with a number
  if (/^\d/.test(username)) {
    usernameStatus.textContent = 'Username cannot start with a number';
    usernameStatus.className = 'username-status error';
    usernameLoader.style.display = 'none';
    return;
  }

  // Passed initial checks → proceed to API after debounce
  debounceTimeout = setTimeout(() => {
    checkUsernameAvailability(username);
  }, 800); // increased delay
});



async function checkUsernameAvailability(username) {
    usernameStatus.textContent = 'Checking...';
    usernameStatus.className = 'username-status';
    usernameLoader.style.display = 'inline-block'; // show loader

    try {
   const res = await fetch(`${FIXA_CONFIG.API_URL}/api/users/check-username?username=${encodeURIComponent(username)}`);
        const data = await res.json();

        if (data.isAvailable) {
            usernameStatus.textContent = 'Username is available';
            usernameStatus.className = 'username-status success';
        } else {
            usernameStatus.textContent = 'Username is already taken';
            usernameStatus.className = 'username-status error';
        }
    } catch (error) {
        usernameStatus.textContent = 'Error checking username';
        usernameStatus.className = 'username-status error';
        console.error(error);
    } finally {
        usernameLoader.style.display = 'none'; // hide loader
    }
}


    // ✅ Enable/disable signup button based on input validity
    function updateSignupButtonState() {
        const input = emailOrPhoneInput.value.trim();
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const reconfirmPassword = reconfirmPasswordInput.value;

        const isFormFilled = input && username && password && reconfirmPassword;
        const arePasswordsMatching = password === reconfirmPassword;
        const isPasswordLongEnough = password.length >= 6;

        signupBtn.disabled = !(isFormFilled && arePasswordsMatching && isPasswordLongEnough);
    }

    emailOrPhoneInput.addEventListener('input', updateSignupButtonState);
    usernameInput.addEventListener('input', updateSignupButtonState);
    passwordInput.addEventListener('input', updateSignupButtonState);
    reconfirmPasswordInput.addEventListener('input', updateSignupButtonState);
    document.addEventListener('DOMContentLoaded', updateSignupButtonState);

    // ✅ Signup form submission
  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = usernameInput.value.trim();
    const emailOrPhone = emailOrPhoneInput.value.trim();
    const password = passwordInput.value;
    const reconfirmPassword = reconfirmPasswordInput.value;

    // Password checks
    if (password !== reconfirmPassword) {
        messageDisplay.textContent = 'Passwords do not match.';
        messageDisplay.style.color = 'red';
        return;
    }
    if (password.length < 6) {
        messageDisplay.textContent = 'Password must be at least 6 characters long.';
        messageDisplay.style.color = 'red';
        return;
    }

    // Contact validation
    const isValidEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailOrPhone);
    const isValidPhone = /^\+?[0-9]{7,15}$/.test(emailOrPhone); // Basic phone pattern

    if (!isValidEmail && !isValidPhone) {
        messageDisplay.textContent = 'Please enter a valid email or phone number.';
        messageDisplay.style.color = 'red';
        return;
    }

    // Payload
   let payload = {
    username,
    password,
    contact: emailOrPhone,
    contactType: isValidEmail ? "email" : "phone",
    role: null
};

    if (isValidEmail) payload.email = emailOrPhone;
    if (isValidPhone) payload.phone = emailOrPhone;

    signupBtn.disabled = true;
    messageDisplay.textContent = 'Creating account...';
    messageDisplay.style.color = 'black';


    
    try {
const response = await fetch(`${FIXA_CONFIG.API_URL}/api/users/register`, {
  method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });

        const data = await response.json();

        if (response.ok) {
            messageDisplay.textContent = 'Registration successful! Redirecting...';
            messageDisplay.style.color = 'green';
            signupForm.reset();
            setTimeout(() => {
                window.location.href = 'SignIn.html';
            }, 2000);
        } else {
            messageDisplay.textContent = data.message || 'Registration failed.';
            messageDisplay.style.color = 'red';
        }
    } catch (error) {
        messageDisplay.textContent = 'Network error. Try again.';
        messageDisplay.style.color = 'red';
        console.error(error);
    } finally {
        signupBtn.disabled = false;
    }
});
async function handleGoogleAuth(response) {
  const credential = response.credential;
  if (!credential) {
    messageDisplay.textContent = 'Google sign-up cancelled';
    messageDisplay.style.color = 'red';
    return;
  }

  signupBtn.disabled = true;
  messageDisplay.textContent = 'Creating account with Google...';
  messageDisplay.style.color = 'black';

  try {
const res = await fetch(`${FIXA_CONFIG.API_URL}/api/users/google-auth`, {
  method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential })
      // No `role` here — user picks it on role-selection page
    });
    const data = await res.json();

    if (!res.ok) {
      messageDisplay.textContent = data.message || 'Google sign-up failed';
      messageDisplay.style.color = 'red';
      signupBtn.disabled = false;
      return;
    }

    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));

    messageDisplay.textContent = data.isNewUser
      ? 'Account created! Choose your role...'
      : 'Welcome back! Redirecting...';
    messageDisplay.style.color = 'green';

    setTimeout(() => {
      if (data.needsRoleSelection || !data.user.role) {
        window.location.href = 'role-selection.html';
      } else if (data.user.role === 'customer') {
        window.location.href = 'customer-home.html';
      } else if (data.user.role === 'artisan') {
        window.location.href = 'artisan test.html';
      }
    }, 1000);
  } catch (err) {
    console.error('[Google sign-up]', err);
    messageDisplay.textContent = 'Network error. Try again.';
    messageDisplay.style.color = 'red';
    signupBtn.disabled = false;
  }
}
window.handleGoogleAuth = handleGoogleAuth;

const networkStatusBanner = document.getElementById("networkStatusBanner");

// --- Network Status Checker Functions ---

function updateNetworkStatus() {
    if (navigator.onLine) {
        // User is online. Hide the error banner and show a temporary "back online" message.
        networkStatusBanner.classList.remove('offline');
        
        // Optional: Show "Back Online" message briefly
        networkStatusBanner.classList.add('online-success');
        networkStatusBanner.innerHTML = '<i class="fas fa-check-circle"></i> Connection restored. You are back online.';
        
        // Hide the success message after 3 seconds
        setTimeout(() => {
            networkStatusBanner.classList.remove('online-success');
        }, 3000);

    } else {
        // User is offline. Display the error banner immediately.
        networkStatusBanner.classList.remove('online-success');
        networkStatusBanner.classList.add('offline');
        networkStatusBanner.innerHTML = '<i class="fas fa-exclamation-triangle"></i> You are currently offline. Please check your connection.';
    }
}

// Attach event listeners to the window
window.addEventListener('online', updateNetworkStatus);
window.addEventListener('offline', updateNetworkStatus);

// Initial check when the page loads
document.addEventListener('DOMContentLoaded', () => {
    // ... existing DOMContentLoaded code (updateSignupButtonState, etc.) ...
    
    // Perform an initial check
    updateNetworkStatus(); 
});

// ... rest of your existing JS code ...
</script>
